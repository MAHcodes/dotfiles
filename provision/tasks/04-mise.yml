---
- name: Check for mise
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.local/bin/mise"
  register: mise_bin

- name: Install mise
  # One-time bootstrap; skipped once ~/.local/bin/mise exists.
  ansible.builtin.shell: curl -fsSL https://mise.run | sh
  when: not mise_bin.stat.exists
  args:
    executable: /usr/bin/bash

- name: Install mise-managed tools
  # Reads ~/.config/mise/config.toml (tracked in the repo via the `mise`
  # stow package).
  ansible.builtin.command:
    cmd: "{{ ansible_user_dir }}/.local/bin/mise install"
    chdir: "{{ ansible_user_dir }}"
  register: mise_install
  changed_when: mise_install.stdout != ''
