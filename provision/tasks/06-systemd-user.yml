---
- name: Check for hermes-gateway user unit
  # Present only after the `systemd` stow package is migrated into the
  # repo (see README). Until then this task silently skips.
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/systemd/user/hermes-gateway.service"
  register: hermes_unit

- name: Enable hermes-gateway user service
  ansible.builtin.systemd_service:
    name: hermes-gateway.service
    scope: user
    enabled: true
    daemon_reload: true
  when: hermes_unit.stat.exists
